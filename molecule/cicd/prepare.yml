---
# Apache Tomcat Molecule — Prepare for cicd scenario.

- name: Molecule | Prepare
  hosts: all

  tasks:
    - name: Prepare | Fix /etc/shadow permissions
      ansible.builtin.file:
        path: /etc/shadow
        mode: "0400"

    - name: Prepare | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false

    - name: Prepare | Install Java JDK
      ansible.builtin.dnf:
        name: java-17-openjdk-headless
        state: present

    - name: Prepare | Install openssh-server for SSH key testing
      ansible.builtin.dnf:
        name: openssh-server
        state: present

    - name: Prepare | Generate test SSH key pair
      ansible.builtin.command:
        cmd: "ssh-keygen -t rsa -b 2048 -f /tmp/test_deploy_key -N ''"
        creates: "/tmp/test_deploy_key"
      changed_when: false

    - name: Prepare | Read test public key
      ansible.builtin.slurp:
        src: /tmp/test_deploy_key.pub
      register: __prepare_test_ssh_key

    - name: Prepare | Set test SSH key fact
      ansible.builtin.set_fact:
        __test_deployer_ssh_key: "{{ __prepare_test_ssh_key.content | b64decode | trim }}"

    - name: Prepare | Wait for systemd to complete initialization
      ansible.builtin.systemd:
        name: multi-user.target
        state: started
      register: systemctl_status
      until: true
      retries: 30
      delay: 5
      when:
        - ansible_facts['service_mgr'] == 'systemd'
      changed_when: false
      failed_when: false
