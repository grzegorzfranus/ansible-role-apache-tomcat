---
# Apache Tomcat Molecule — Converge for default scenario.

- name: Molecule | Converge
  hosts: all

  pre_tasks:
    - name: Converge | Wait for systemd to complete initialization
      ansible.builtin.systemd:
        name: multi-user.target
        state: started
      register: systemctl_status
      until: true
      retries: 30
      delay: 5
      when:
        - ansible_facts['service_mgr'] == 'systemd'
      changed_when: false
      failed_when: false

  vars:
    tomcat_enable_hardening: true
    tomcat_enable_cicd: false
    tomcat_enable_jmx: false
    tomcat_ssl_generate_self_signed: true

  roles:
    - role: ../../..

  post_tasks:
    - name: Converge | Display role execution summary
      ansible.builtin.debug:
        msg: "Apache Tomcat role execution completed"
