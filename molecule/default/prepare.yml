---
# Apache Tomcat Molecule — Prepare for default scenario.

- name: Molecule | Prepare
  hosts: all

  tasks:
    - name: Prepare | Fix /etc/shadow permissions
      ansible.builtin.file:
        path: /etc/shadow
        mode: "0400"

    - name: Prepare | Update dnf cache
      ansible.builtin.dnf:
        update_cache: true
      changed_when: false

    - name: Prepare | Install packages (Java JDK, Logrotate, and tar)
      ansible.builtin.dnf:
        name:
          - "{{ 'java-17-amazon-corretto-headless' if ansible_facts['distribution'] == 'Amazon' else 'java-17-openjdk-headless' }}"
          - logrotate
          - tar
        state: present

    - name: Prepare | Wait for systemd to complete initialization
      ansible.builtin.systemd:
        name: multi-user.target
        state: started
      register: systemctl_status
      until: systemctl_status is succeeded
      retries: 30
      delay: 5
      when:
        - ansible_facts['service_mgr'] == 'systemd'
      changed_when: false
