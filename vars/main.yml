---
# =============================================================================
# Ansible Role: Apache Tomcat - Internal Variables
# =============================================================================
# Common variables shared across all distributions.
# These are NOT user-overridable. All use double-underscore prefix per CoP §3.1.4.
# =============================================================================

__tomcat_logrotate_config_path: "/etc/logrotate.d/{{ tomcat_service_name }}"
__tomcat_systemd_unit_path: "/etc/systemd/system/{{ tomcat_service_name }}.service"
__tomcat_archive_filename: "apache-tomcat-{{ tomcat_version }}.tar.gz"
__tomcat_ssl_private_key_path: "{{ tomcat_catalina_base }}/conf/keystore.key"
__tomcat_ssl_certificate_path: "{{ tomcat_catalina_base }}/conf/keystore.crt"
__tomcat_ssl_csr_path: "{{ tomcat_catalina_base }}/conf/keystore.csr"

# --- SELinux ---
__tomcat_selinux_packages:
  - policycoreutils-python-utils
  - policycoreutils
  - checkpolicy
