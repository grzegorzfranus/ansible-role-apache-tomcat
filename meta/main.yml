---
galaxy_info:
  role_name: apache_tomcat
  author: Grzegorz Franus
  namespace: grzegorzfranus
  description: >
    Ansible role for deploying Apache Tomcat using Split architecture. Features systemd logging redirect,
    hardened systemd service, HTTPS with PKCS12 keystore, optional CI/CD user, JMX monitoring, and logrotate.
  license: Apache-2.0
  company: EWARE
  min_ansible_version: "2.16"

  platforms:
    - name: EL
      versions:
        - "9"

  galaxy_tags:
    - tomcat
    - java
    - web
    - applicationserver
    - security
    - hardening
    - ssl
    - systemd
    - cicd
    - jmx

dependencies: []

collections:
  - community.crypto
