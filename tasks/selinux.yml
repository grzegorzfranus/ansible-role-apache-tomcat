---
# =============================================================================
# Ansible Role: Apache Tomcat - Tasks: SELinux
# =============================================================================
# Configures SELinux policy for Tomcat on EL9 with SELinux enforcing.
# Installs a custom policy module that allows systemd (init_t) to resolve
# symlinks, execute catalina.sh, and write to log files under /opt/tomcat/.
# =============================================================================

- name: Tomcat | selinux | Install SELinux management packages
  become: true
  ansible.builtin.dnf:
    name: "{{ __tomcat_selinux_packages }}"
    state: present

- name: Tomcat | selinux | Create local SELinux policy directory
  become: true
  ansible.builtin.file:
    path: "{{ __tomcat_selinux_policy_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Justification: Use command module because restorecon (SELinux context restore)
# has no native Ansible module. Ensures log directory inherits correct var_log_t
# context from /var/log/ parent after any prior incorrect labeling.
- name: Tomcat | selinux | Restore default SELinux contexts on log directory
  become: true
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ tomcat_log_dir }}"
  changed_when: __tomcat_selinux_restorecon_log.stdout | length > 0
  register: __tomcat_selinux_restorecon_log

# Justification: Use command module because restorecon has no native Ansible module.
# Ensures install directory has correct default SELinux contexts.
- name: Tomcat | selinux | Restore default SELinux contexts on install directory
  become: true
  ansible.builtin.command:
    cmd: "restorecon -Rv {{ tomcat_install_dir }}"
  changed_when: __tomcat_selinux_restorecon_install.stdout | length > 0
  register: __tomcat_selinux_restorecon_install

- name: Tomcat | selinux | Template custom SELinux policy source
  become: true
  ansible.builtin.template:
    src: selinux/tomcat_systemd.te.j2
    dest: "{{ __tomcat_selinux_policy_te }}"
    mode: "0644"

# Justification: Use command module because checkmodule (SELinux policy compiler)
# has no native Ansible module. Compiles .te source into binary .mod module.
- name: Tomcat | selinux | Compile custom SELinux policy module
  become: true
  ansible.builtin.command:
    cmd: "checkmodule -M -m -o {{ __tomcat_selinux_policy_mod }} {{ __tomcat_selinux_policy_te }}"
    creates: "{{ __tomcat_selinux_policy_mod }}"

# Justification: Use command module because semodule_package (SELinux packaging)
# has no native Ansible module. Packages compiled module into installable .pp.
- name: Tomcat | selinux | Package custom SELinux policy module
  become: true
  ansible.builtin.command:
    cmd: "semodule_package -o {{ __tomcat_selinux_policy_pp }} -m {{ __tomcat_selinux_policy_mod }}"
    creates: "{{ __tomcat_selinux_policy_pp }}"

# Justification: Use command module because semodule (SELinux module management)
# has no native Ansible module. Installs the policy at priority 300 (custom).
# The semodule command is idempotent — reinstalling the same module is a no-op.
- name: Tomcat | selinux | Load custom SELinux policy module
  become: true
  ansible.builtin.command:
    cmd: "semodule -X 300 -i {{ __tomcat_selinux_policy_pp }}"
  changed_when: false
