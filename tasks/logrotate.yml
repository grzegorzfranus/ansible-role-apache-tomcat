---
# =============================================================================
# Ansible Role: Apache Tomcat - Tasks: Logrotate
# =============================================================================
# Configure log rotation for Tomcat text log files (catalina.out, access logs).
# GC logs are created by JVM -Xlog, but rotated exclusively by logrotate (since JVM filecount=0).
# =============================================================================

- name: Tomcat | logrotate | Ensure archive log directory exists
  become: true
  ansible.builtin.file:
    path: "{{ tomcat_logrotate_options.archive_directory_path }}"
    state: directory
    owner: "{{ tomcat_user }}"
    group: "{{ tomcat_group }}"
    mode: "0750"
  when: >
    tomcat_logrotate_options.archive_directory_path is defined and
    tomcat_logrotate_options.archive_directory_path | length > 0

- name: Tomcat | logrotate | Deploy logrotate configuration file
  become: true
  ansible.builtin.template:
    src: logrotate/tomcat.j2
    dest: "/etc/logrotate.d/{{ tomcat_service_name }}"
    owner: root
    group: root
    mode: "0644"
    validate: "logrotate -d %s"
    backup: true
